<title>Beta 3 Test Run</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one reading column; a sticky progress strip; sections as timing-sheet groups, rows as checks. */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --fg: #15171c; --muted: #5d6370; --line: #dfe2e8;
  --accent: #7b3fe4;            /* timing purple */
  --ok: #138a4b; --ok-bg: #e3f5ea;
  --bad: #c2410c; --bad-bg: #fdebe0;
  --todo: #8a8f9a;
  --code-bg: #eef0f4;
  --f-display: "Titillium Web", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1115; --surface: #181b21; --fg: #e8eaee; --muted: #9aa1ad; --line: #2a2f38;
  --accent: #a77bff; --ok: #4ade80; --ok-bg: #12301f; --bad: #fb923c; --bad-bg: #3a1f10;
  --todo: #6b7280; --code-bg: #20242c; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1115; --surface: #181b21; --fg: #e8eaee; --muted: #9aa1ad; --line: #2a2f38;
  --accent: #a77bff; --ok: #4ade80; --ok-bg: #12301f; --bad: #fb923c; --bad-bg: #3a1f10;
  --todo: #6b7280; --code-bg: #20242c; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 64px; }
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
h1 { font-size: 30px; line-height: 1.15; letter-spacing: .01em; }
h2 { font-size: 19px; letter-spacing: .02em; }
.lede { color: var(--muted); margin: 6px 0 0; max-width: 62ch; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.meter { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--line); }
.meter span { display: block; height: 100%; transition: width .3s; }
.meter .m-ok { background: var(--ok); } .meter .m-bad { background: var(--bad); }
.barrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.barrow b { color: var(--fg); font-weight: 600; }
.filters { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.chip { font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.chip:focus-visible, .seg button:focus-visible, textarea:focus-visible, .copy:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.saved { font-size: 12px; }

section.group { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
section.group > details > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
section.group > details > summary::-webkit-details-marker { display: none; }
.count { font-family: var(--f-mono); font-size: 12px; color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
.gnote { font-size: 13px; color: var(--muted); padding: 0 16px 10px; margin: 0; }

.item { border-top: 1px solid var(--line); padding: 12px 16px; display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; }
.item[data-s="ok"] { box-shadow: inset 3px 0 0 var(--ok); }
.item[data-s="bad"] { box-shadow: inset 3px 0 0 var(--bad); }
.it-text { min-width: 0; }
.it-title { font-weight: 600; }
.it-how { color: var(--muted); font-size: 14px; margin-top: 2px; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.tag { font-family: var(--f-mono); font-size: 11px; padding: 1px 7px; border-radius: 4px; background: var(--code-bg); color: var(--muted); }
.tag.code { color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; align-self: start; }
.seg button { font: inherit; font-size: 13px; padding: 6px 10px; border: 0; background: var(--surface); color: var(--muted); cursor: pointer; min-height: 36px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"][data-v="todo"] { background: var(--code-bg); color: var(--fg); font-weight: 600; }
.seg button[aria-pressed="true"][data-v="ok"] { background: var(--ok-bg); color: var(--ok); font-weight: 600; }
.seg button[aria-pressed="true"][data-v="bad"] { background: var(--bad-bg); color: var(--bad); font-weight: 600; }
.note { grid-column: 1 / -1; }
.note textarea { width: 100%; min-height: 64px; resize: vertical; font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
.note label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.addnote { grid-column: 1 / -1; justify-self: start; font: inherit; font-size: 12px; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; }

pre.cmd { margin: 8px 0 0; background: var(--code-bg); border-radius: 8px; padding: 10px 12px; overflow-x: auto; font-family: var(--f-mono); font-size: 13px; line-height: 1.6; }
.cmdrow { display: flex; align-items: start; gap: 8px; }
.cmdrow pre { flex: 1; min-width: 0; }
.copy { font: inherit; font-size: 12px; margin-top: 8px; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
details.steps { margin-top: 8px; }
details.steps > summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--accent); }
details.steps ol { margin: 8px 0 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
details.steps ol li::marker { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.pass { margin: 8px 0 0; font-size: 14px; padding: 8px 10px; border-radius: 8px; background: var(--ok-bg); color: var(--fg); }
.pass b { color: var(--ok); }
.foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 13px; color: var(--muted); }
.empty { padding: 14px 16px; color: var(--muted); font-size: 14px; border-top: 1px solid var(--line); }
@media (max-width: 520px) { .item { grid-template-columns: 1fr; } .filters { margin-left: 0; } }
@media (prefers-reduced-motion: reduce) { .meter span { transition: none; } }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Apex DuoView · v1.0-beta.3</div>
    <h1>Beta 3 test run</h1>
    <p class="lede">Everything built so far that only your Mac, the simulator, or a live weekend can check. Mark each row <b>Works</b> or <b>Problem</b>; for a problem, say what you saw in the note. Claude can read this page's results back.</p>
  </header>

  <div class="bar" role="region" aria-label="Progress">
    <div class="meter" aria-hidden="true"><span class="m-ok" id="mOk"></span><span class="m-bad" id="mBad"></span></div>
    <div class="barrow">
      <span><b id="cOk">0</b> work</span><span><b id="cBad">0</b> problems</span><span><b id="cTodo">0</b> to try</span>
      <span class="saved" id="saved">Loading your results…</span>
      <div class="filters" role="group" aria-label="Show">
        <button class="chip" data-f="all" aria-pressed="true">All</button>
        <button class="chip" data-f="todo" aria-pressed="false">To try</button>
        <button class="chip" data-f="bad" aria-pressed="false">Problems</button>
      </div>
    </div>
  </div>

  <main id="groups" class="wrap" style="gap:14px"></main>

  <div class="foot">
    <button class="copy" id="copyProblems" type="button">Copy problems as text</button>
    <span id="copyMsg" aria-live="polite"></span>
  </div>
</div>

  { id: "b13", title: "Build 13 · Fold layouts with data",
    items: [
      { id: "b13-layouts", t: "Each fold's data layout, with 1 to 4 feeds", h: "Flat: Director's Desk. Book: data screen. Laptop: Race Engineer and Scrub Deck. Use ⟳ to reach them.", code: "T-B3",
        steps: [
          "If you turned the simulator for laptop earlier, turn it back so the screen is wider than tall (Device › Rotate Right, ⌘→).",
          "Before opening the video, set the fold to flat: open the simulator fully with its fold control, or in Settings › Debug (bottom of Settings) turn on \"Simulate fold\" and set \"Posture\" to \"Flat\". Settings › Fold › \"Posture\" should read \"Flat\".",
          "From the home screen, tap the \"Archive\" tab, scroll to \"Seasons\", tap \"2026\", then tap the São Paulo weekend (F1 TV names it, something like \"São Paulo Grand Prix\").",
          "In the \"Sessions\" row, tap the race tile.",
          "Tap the red \"Watch multiview\" button.",
          "Tap \"Feeds\" (top right), then \"Reset to default\", then \"Done\", so the four feeds are the world feed (INTERNATIONAL), your driver's onboard, TRACKER and DATA.",
          "Wait for the timing: when it has loaded, a thin white tick (lights out, or the session start outside races) appears just under the timeline at the bottom. If the controls are hidden, tap the \"•••\" at the top or the dark space around the feeds.",
          "Flat, four feeds: tap \"Switch layout\" (the ⟳ arrows, top right) until you see Director's Desk: the tower as a full-height column on the right, the main feed big at the top left, and a row below with two small feeds and the map (the fourth feed plays out of sight).",
          "Three feeds: tap \"Feeds\", tap the DATA row and choose \"Empty\", tap \"Done\" (tap \"Fit 3 to the screen\" if asked). ⟳ until Director's Desk shows again.",
          "Two feeds: the same with the TRACKER row (\"Fit 2 to the screen\"). ⟳ to Director's Desk.",
          "One feed: the same with the last row that isn't INTERNATIONAL (\"Fit 1 to the screen\"). ⟳ to Director's Desk.",
          "Book: tap ✕, set the fold to book (Settings › Debug › \"Posture\" › \"Book\", or the fold control), and tap \"Watch multiview\".",
          "Tap \"Feeds\" › \"Reset to default\" › \"Done\". ⟳ until the data screen: feeds on the left screen (a 2 × 2 grid with four), the map over the tower on the right screen, nothing on the fold.",
          "Drop to 3, 2 and 1 feeds as above and ⟳ to the data screen each time (two feeds stack, one sits alone).",
          "Laptop: tap ✕, set the fold to laptop (rotate the simulator first, then the fold control or \"Posture\" › \"Laptop\"), and tap \"Watch multiview\".",
          "Tap \"Feeds\" › \"Reset to default\" › \"Done\". ⟳ reaches Race Engineer (console under the main feed) and then the Scrub Deck.",
          "Drop to 3, 2 and 1 feeds as above and reach both each time (with one feed the Scrub Deck is the default and ⟳ gives Race Engineer).",
          "When you're done, tap \"Feeds\" › \"Reset to default\" › \"Done\" to get the usual four feeds back.",
        ],
        pass: "in every fold and with 1 to 4 feeds, ⟳ reaches that fold's data layout and it looks as described: Director's Desk (flat), the data screen (book), Race Engineer and Scrub Deck (laptop)." },
      { id: "b13-glides", t: "Glides between layouts and folds", h: "The same videos slide into place; none restart.",
        steps: [
          "This needs the simulator's own fold control while the video plays (Settings can't be opened over a playing multiview). In Settings › Debug turn \"Simulate fold\" off, and check Settings › Fold › \"Source\" reads \"Device\".",
          "If you turned the simulator for laptop earlier, turn it back so the screen is wider than tall (Device › Rotate Right, ⌘→). Open the simulator fully flat with its own fold control.",
          "From the home screen, tap the \"Archive\" tab, scroll to \"Seasons\", tap \"2026\", then tap the São Paulo weekend (F1 TV names it, something like \"São Paulo Grand Prix\").",
          "In the \"Sessions\" row, tap the race tile.",
          "Tap the red \"Watch multiview\" button.",
          "Tap \"Feeds\" (top right), then \"Reset to default\", then \"Done\", so the four feeds are the world feed (INTERNATIONAL), your driver's onboard, TRACKER and DATA.",
          "Wait for the timing: when it has loaded, a thin white tick (lights out, or the session start outside races) appears just under the timeline at the bottom. If the controls are hidden, tap the \"•••\" at the top or the dark space around the feeds.",
          "Tap \"Switch layout\" several times, watching the feeds: each layout change should slide the same videos to their new places.",
          "While it plays, half-open the simulator like a book with its fold control, then open it flat again.",
          "Rotate the simulator (Device › Rotate Left, ⌘←) and half-open it for laptop, then rotate back and open flat.",
          "At every change, watch for a video restarting, going black, or jumping in time.",
        ],
        pass: "every layout and fold change slides the same videos (and map, tower, console or deck) into place, with no video restarting, going black or losing its moment." },
      { id: "b13-docked", t: "Map and tower inside a layout work", h: "Tap cars and rows, the Battle chip. In Director's Desk the map header fits and the narrow tower drops two columns.",
        steps: [
          "If you haven't picked one yet: Settings (gear on the home screen) › Multiview › \"My driver\" › pick a driver, then \"Done\".",
          "If you turned the simulator for laptop earlier, turn it back so the screen is wider than tall (Device › Rotate Right, ⌘→).",
          "Before opening the video, set the fold to flat: open the simulator fully with its fold control, or in Settings › Debug (bottom of Settings) turn on \"Simulate fold\" and set \"Posture\" to \"Flat\". Settings › Fold › \"Posture\" should read \"Flat\".",
          "From the home screen, tap the \"Archive\" tab, scroll to \"Seasons\", tap \"2026\", then tap the São Paulo weekend (F1 TV names it, something like \"São Paulo Grand Prix\").",
          "In the \"Sessions\" row, tap the race tile.",
          "Tap the red \"Watch multiview\" button.",
          "Tap \"Feeds\" (top right), then \"Reset to default\", then \"Done\", so the four feeds are the world feed (INTERNATIONAL), your driver's onboard, TRACKER and DATA.",
          "Wait for the timing: when it has loaded, a thin white tick (lights out, or the session start outside races) appears just under the timeline at the bottom. If the controls are hidden, tap the \"•••\" at the top or the dark space around the feeds.",
          "Tap \"Switch layout\" (the ⟳ arrows, top right) until you see Director's Desk (tower column on the right, map in the row below).",
          "Check the map's header fits: \"−1 s\", the offset (e.g. \"−7 s\"), \"+1 s\" and the two turn arrows (⟲ ⟳) all show, none cut off.",
          "Check the narrow tower shows position, driver code, gap and tyre, but not the interval or last-lap columns.",
          "Tap a car's dot on the docked map: its onboard opens. Tap a row in the tower: that car's onboard opens.",
          "Try \"−1 s\", \"+1 s\" and ⟲ ⟳ on the docked map. If your driver is within a second of another car, the yellow \"Battle\" chip shows in the map header; tap it to open the rival's onboard.",
          "Do the same on the book data screen (set the fold to book first) where the tower has more room.",
          "When you're done, tap \"Feeds\" › \"Reset to default\" › \"Done\" to get the usual four feeds back.",
        ],
        pass: "the docked map and tower work like the floating ones (car taps, rows, Battle, −1 s / +1 s, turning), the Director's Desk map header fits, and the narrow tower drops the interval and last-lap columns." },

          "From the home screen, tap the \"Archive\" tab, scroll to \"Seasons\", tap \"2026\", then tap the São Paulo weekend (F1 TV names it, something like \"São Paulo Grand Prix\").",

        pass: "in laptop with one feed the bottom half reads \"Loading timing…\" while timing loads, \"No timing for this session\" on a video without timing, and nothing once the Scrub Deck takes over." },
      { id: "b13-error", t: "An error hides the layout's map and tower",
        steps: [
          "If you turned the simulator for laptop earlier, turn it back so the screen is wider than tall (Device › Rotate Right, ⌘→).",
          "Before opening the video, set the fold to flat: open the simulator fully with its fold control, or in Settings › Debug (bottom of Settings) turn on \"Simulate fold\" and set \"Posture\" to \"Flat\". Settings › Fold › \"Posture\" should read \"Flat\".",
          "From the home screen, tap the \"Archive\" tab, scroll to \"Seasons\", tap \"2026\", then tap the São Paulo weekend (F1 TV names it, something like \"São Paulo Grand Prix\").",
          "In the \"Sessions\" row, tap the race tile.",
          "Tap the red \"Watch multiview\" button.",
          "Wait for the timing: when it has loaded, a thin white tick (lights out, or the session start outside races) appears just under the timeline at the bottom. If the controls are hidden, tap the \"•••\" at the top or the dark space around the feeds.",
          "Tap \"Switch layout\" (the ⟳ arrows, top right) until you see Director's Desk (map and tower on screen).",
          "Turn off the Mac's Wi‑Fi (Wi‑Fi icon in the Mac's menu bar › switch Wi‑Fi off; the simulator uses the Mac's connection; unplug the cable if the Mac uses one).",
          "Keep it playing until the main feed runs out of buffered video and an error message with a \"Close\" button covers the multiview. This can take a minute or more; if after 5 minutes the video just freezes with no message, write \"no error shown\" in the note.",
          "While the error shows, check the map and the tower are gone too.",
          "Turn the Mac's Wi‑Fi back on. Tap \"Close\".",
        ],
        pass: "when an error covers the multiview, the layout's map and tower are hidden along with everything else." },
      { id: "b13-fallback", t: "A remembered data layout steps back without timing", h: "Comes back on a replay with timing.",
        steps: [
          "If you turned the simulator for laptop earlier, turn it back so the screen is wider than tall (Device › Rotate Right, ⌘→).",
          "Before opening the video, set the fold to flat: open the simulator fully with its fold control, or in Settings › Debug (bottom of Settings) turn on \"Simulate fold\" and set \"Posture\" to \"Flat\". Settings › Fold › \"Posture\" should read \"Flat\".",
          "From the home screen, tap the \"Archive\" tab, scroll to \"Seasons\", tap \"2026\", then tap the São Paulo weekend (F1 TV names it, something like \"São Paulo Grand Prix\").",
          "In the \"Sessions\" row, tap the race tile.",
          "Tap the red \"Watch multiview\" button.",
          "Tap \"Feeds\" (top right), then \"Reset to default\", then \"Done\", so the four feeds are the world feed (INTERNATIONAL), your driver's onboard, TRACKER and DATA.",
          "Wait for the timing: when it has loaded, a thin white tick (lights out, or the session start outside races) appears just under the timeline at the bottom. If the controls are hidden, tap the \"•••\" at the top or the dark space around the feeds.",
          "Tap \"Switch layout\" (the ⟳ arrows, top right) until you see Director's Desk. Tap ✕ to close.",
          "Tap \"Watch multiview\" again and watch straight away: until the timing loads it shows the normal flat layout, then switches to Director's Desk once the white tick appears.",
          "Tap ✕. Open a video from the weekend's \"Highlights and shows\" that has a \"Watch multiview\" button: it opens in the normal flat layout, not Director's Desk. (If none offers multiview, note it.)",
          "Tap ✕, go back to the race, and open the multiview again: Director's Desk comes back once the timing loads.",
        ],
        pass: "a remembered data layout shows the fold's normal layout whenever there's no timing (loading, or a video without timing) and comes back on its own on a replay with timing." },
      { id: "b13-delay", t: "Tracker delay (Settings › Multiview)", h: "TRACKER and DATA hold that far behind the world feed. Also with TRACKER as the main feed, and after picture in picture.",
        steps: [
          "First do T-B1 (Build 11) to know how many seconds TRACKER runs ahead.",
          "Settings (gear on the home screen) › Multiview › \"Tracker delay\": tap \"+\" until it shows that number (it moves in 0.5 s steps). Tap \"Done\".",
          "If you turned the simulator for laptop earlier, turn it back so the screen is wider than tall (Device › Rotate Right, ⌘→).",
          "Before opening the video, set the fold to flat: open the simulator fully with its fold control, or in Settings › Debug (bottom of Settings) turn on \"Simulate fold\" and set \"Posture\" to \"Flat\". Settings › Fold › \"Posture\" should read \"Flat\".",
          "From the home screen, tap the \"Archive\" tab, scroll to \"Seasons\", tap \"2026\", then tap the São Paulo weekend (F1 TV names it, something like \"São Paulo Grand Prix\").",
          "In the \"Sessions\" row, tap the race tile.",
          "Tap the red \"Watch multiview\" button.",
          "Tap \"Feeds\" (top right), then \"Reset to default\", then \"Done\", so the four feeds are the world feed (INTERNATIONAL), your driver's onboard, TRACKER and DATA.",
          "Wait for the timing: when it has loaded, a thin white tick (lights out, or the session start outside races) appears just under the timeline at the bottom. If the controls are hidden, tap the \"•••\" at the top or the dark space around the feeds.",
          "Watch the leader cross the line on INTERNATIONAL and on TRACKER: they should now cross together. DATA should match the world feed too.",
          "Tap the TRACKER tile to make it the main feed: the other feeds now run level with it (the world feed shows the same moment as TRACKER).",
          "Tap the world feed's small tile to swap back.",
          "Go to the simulator's home screen: Simulator menu bar › Device › Home (⇧⌘H). The picture-in-picture window shows the feed with the sound. Click the window, then its \"back to app\" button: back in the multiview, TRACKER and DATA are still held behind by the same amount.",
        ],
        pass: "with the delay set, TRACKER and DATA show the same moment as the world feed, also with TRACKER as the main feed and after picture in picture." },
    ]},
  { id: "b12", title: "Build 12 · Tower, driver cards, tap a car",
    items: [
      { id: "b12-tap", t: "Tap a car on the map or the tower: its onboard opens", h: "The card shows the lap time and the speed.", code: "T-B2",
        steps: [
          "If you turned the simulator for laptop earlier, turn it back so the screen is wider than tall (Device › Rotate Right, ⌘→).",
          "Before opening the video, set the fold to flat: open the simulator fully with its fold control, or in Settings › Debug (bottom of Settings) turn on \"Simulate fold\" and set \"Posture\" to \"Flat\". Settings › Fold › \"Posture\" should read \"Flat\".",
          "From the home screen, tap the \"Archive\" tab, scroll to \"Seasons\", tap \"2026\", then tap the São Paulo weekend (F1 TV names it, something like \"São Paulo Grand Prix\").",
          "In the \"Sessions\" row, tap the race tile.",
          "Tap the red \"Watch multiview\" button.",
          "Wait for the timing: when it has loaded, a thin white tick (lights out, or the session start outside races) appears just under the timeline at the bottom. If the controls are hidden, tap the \"•••\" at the top or the dark space around the feeds.",
          "Tap \"Map\" at the top right (in the single-feed player it's beside ✕ at the top left): the map and the tower appear as floating panels. If there's no \"Map\" button because the layout already has a map and tower built in, tap \"Switch layout\" until they're gone, then tap \"Map\".",
          "Tap a car's dot (with its three-letter code) on the map: its onboard opens in the multiview.",
          "Look at the card at the top left of that onboard: position, number and surname, the running lap clock, and after a few seconds the speed (km/h or mph).",
          "Wait until that car crosses the line: the lap time shows on the card for about 6 s.",
          "Tap a row in the tower panel: that car's onboard opens the same way.",
          "When you're done, tap \"Feeds\" › \"Reset to default\" › \"Done\" to get the usual four feeds back.",
        ],
        pass: "tapping a car on the map or a row in the tower opens its onboard, and its card shows the lap time after the line and the speed." },
      { id: "b12-multitap", t: "Tap a car in multiview", h: "A car already showing becomes the main feed; an empty spot fills; otherwise the least interesting onboard is replaced; a notice when nothing can give way.",
        steps: [
          "If you haven't picked one yet: Settings (gear on the home screen) › Multiview › \"My driver\" › pick a driver, then \"Done\".",
          "If you turned the simulator for laptop earlier, turn it back so the screen is wider than tall (Device › Rotate Right, ⌘→).",
          "Before opening the video, set the fold to flat: open the simulator fully with its fold control, or in Settings › Debug (bottom of Settings) turn on \"Simulate fold\" and set \"Posture\" to \"Flat\". Settings › Fold › \"Posture\" should read \"Flat\".",
          "From the home screen, tap the \"Archive\" tab, scroll to \"Seasons\", tap \"2026\", then tap the São Paulo weekend (F1 TV names it, something like \"São Paulo Grand Prix\").",
          "In the \"Sessions\" row, tap the race tile.",
          "Tap the red \"Watch multiview\" button.",
          "Tap \"Feeds\" (top right), then \"Reset to default\", then \"Done\", so the four feeds are the world feed (INTERNATIONAL), your driver's onboard, TRACKER and DATA.",
          "Wait for the timing: when it has loaded, a thin white tick (lights out, or the session start outside races) appears just under the timeline at the bottom. If the controls are hidden, tap the \"•••\" at the top or the dark space around the feeds.",
          "Tap \"Map\" at the top right (in the single-feed player it's beside ✕ at the top left): the map and the tower appear as floating panels. If there's no \"Map\" button because the layout already has a map and tower built in, tap \"Switch layout\" until they're gone, then tap \"Map\".",
          "Already showing: tap your driver's dot on the map. Their tile becomes the big main feed.",
          "Tap \"Feeds\" › \"Reset to default\" › \"Done\".",
          "Empty spot: tap \"Feeds\", tap the DATA row and choose \"Empty\", tap \"Done\" (either answer is fine if asked).",
          "Tap a car that isn't showing: it fills the empty spot, and the other three feeds stay.",
          "Tap \"Feeds\" › \"Reset to default\" › \"Done\".",
          "Replace: tap a car that isn't showing. It replaces your driver's onboard (the only onboard that isn't the main feed or the one you hear); the world feed, TRACKER and DATA stay.",
          "Nothing can give way: tap the speaker button (top right) on the onboard tile, so the red SOUND badge moves there.",
          "Tap another car: the notice \"No free spot — change a feed in the editor.\" shows.",
          "\"No onboard for car N in this session.\" only shows for a car with no onboard; on São Paulo every car may have one, so you may not see it.",
          "Tap the world feed's speaker to move the sound back.",
          "When you're done, tap \"Feeds\" › \"Reset to default\" › \"Done\" to get the usual four feeds back.",
        ],
        pass: "a car already showing becomes the main feed, an empty spot fills, otherwise the least interesting onboard is replaced, and when nothing can give way the notice explains why." },
      { id: "b12-single", t: "Tap a car in a single feed", h: "The onboard starts at the same moment as the feed before it.",
        steps: [
          "If you turned the simulator for laptop earlier, turn it back so the screen is wider than tall (Device › Rotate Right, ⌘→).",
          "Before opening the video, set the fold to flat: open the simulator fully with its fold control, or in Settings › Debug (bottom of Settings) turn on \"Simulate fold\" and set \"Posture\" to \"Flat\". Settings › Fold › \"Posture\" should read \"Flat\".",
          "From the home screen, tap the \"Archive\" tab, scroll to \"Seasons\", tap \"2026\", then tap the São Paulo weekend (F1 TV names it, something like \"São Paulo Grand Prix\").",
          "In the \"Sessions\" row, tap the race tile.",
          "On the race page, tap the first feed row (the world feed, with a ▶ in front) to play it in the single-feed player.",
          "Wait until \"Map\" appears beside ✕ at the top left, then tap it.",
          "Watch for a recognisable moment (a car going into a corner, the lap shown in the tower's header).",
          "Tap a car on the map: the player switches to that car's onboard.",
          "Check the onboard starts at the same moment (same lap in the tower header, the car where the map shows it), and its card shows under ✕ Close.",
        ],
        pass: "the onboard starts at the same moment the previous feed was showing, with its driver card under Close." },
      { id: "b12-card", t: "Driver card controls", h: "Long-press \"Hide card\" beside the tile's own press-and-drag; \"Show card\" brings it back; the card fits small tiles and stays clear of the speaker button.",
        steps: [
          "If you haven't picked one yet: Settings (gear on the home screen) › Multiview › \"My driver\" › pick a driver, then \"Done\".",
          "If you turned the simulator for laptop earlier, turn it back so the screen is wider than tall (Device › Rotate Right, ⌘→).",
          "Before opening the video, set the fold to flat: open the simulator fully with its fold control, or in Settings › Debug (bottom of Settings) turn on \"Simulate fold\" and set \"Posture\" to \"Flat\". Settings › Fold › \"Posture\" should read \"Flat\".",
          "From the home screen, tap the \"Archive\" tab, scroll to \"Seasons\", tap \"2026\", then tap the São Paulo weekend (F1 TV names it, something like \"São Paulo Grand Prix\").",
          "In the \"Sessions\" row, tap the race tile.",
          "Tap the red \"Watch multiview\" button.",
          "Tap \"Feeds\" (top right), then \"Reset to default\", then \"Done\", so the four feeds are the world feed (INTERNATIONAL), your driver's onboard, TRACKER and DATA.",
          "Wait for the timing: when it has loaded, a thin white tick (lights out, or the session start outside races) appears just under the timeline at the bottom. If the controls are hidden, tap the \"•••\" at the top or the dark space around the feeds.",
          "Find the driver card at the top left of your driver's onboard tile.",
          "Click and hold on the card (a long press): a menu with \"Hide card\" appears. Choose it.",
          "The card is gone and a small round button (a person-and-card icon) sits in its place. Tap it (\"Show card\"): the card comes back.",
          "Now press and hold the same tile away from the card, then drag it onto another tile: the two trade places (the drag still works).",
          "Look at the cards on small tiles (⟳ to a layout with small tiles): the card fits inside the tile and stays clear of the speaker button at the tile's top right.",
        ],
        pass: "long-press \"Hide card\" and \"Show card\" work without breaking the tile's own press-and-drag, and the card fits small tiles without covering the speaker button." },
      { id: "b12-units", t: "Speed units follow your region", h: "mph with the phone set to the US or UK, km/h elsewhere.",
        steps: [
          "Go to the simulator's home screen: Simulator menu bar › Device › Home (⇧⌘H).",
          "Open the simulator's Settings app › General › Language & Region › Region, and choose \"United States\".",
          "In Xcode, press Stop, then Run, so Apex DuoView starts fresh.",
          "If you turned the simulator for laptop earlier, turn it back so the screen is wider than tall (Device › Rotate Right, ⌘→).",
          "Before opening the video, set the fold to flat: open the simulator fully with its fold control, or in Settings › Debug (bottom of Settings) turn on \"Simulate fold\" and set \"Posture\" to \"Flat\". Settings › Fold › \"Posture\" should read \"Flat\".",
          "From the home screen, tap the \"Archive\" tab, scroll to \"Seasons\", tap \"2026\", then tap the São Paulo weekend (F1 TV names it, something like \"São Paulo Grand Prix\").",
          "In the \"Sessions\" row, tap the race tile.",
          "Tap the red \"Watch multiview\" button.",
          "Look at the speed on an onboard's card: it reads mph.",
          "Repeat with Region \"United Kingdom\": mph.",
          "Repeat with a region like \"Brazil\" or \"Germany\": km/h.",
          "Set the region back to your own.",
        ],
        pass: "the speed reads mph with the region set to the US or UK and km/h for other regions." },
      { id: "b12-speed", t: "Speed only shows for the moment on screen", h: "Hidden before the data reaches the picture and after seeking past it. Pauses on mobile data with the switch off.", tags: ["Phone"],
        steps: [
          "If you turned the simulator for laptop earlier, turn it back so the screen is wider than tall (Device › Rotate Right, ⌘→).",
          "Before opening the video, set the fold to flat: open the simulator fully with its fold control, or in Settings › Debug (bottom of Settings) turn on \"Simulate fold\" and set \"Posture\" to \"Flat\". Settings › Fold › \"Posture\" should read \"Flat\".",
          "From the home screen, tap the \"Archive\" tab, scroll to \"Seasons\", tap \"2026\", then tap the São Paulo weekend (F1 TV names it, something like \"São Paulo Grand Prix\").",
          "In the \"Sessions\" row, tap the race tile.",
          "Tap the red \"Watch multiview\" button.",
          "Wait for the timing: when it has loaded, a thin white tick (lights out, or the session start outside races) appears just under the timeline at the bottom. If the controls are hidden, tap the \"•••\" at the top or the dark space around the feeds.",
          "Tap \"Map\" at the top right (in the single-feed player it's beside ✕ at the top left): the map and the tower appear as floating panels. If there's no \"Map\" button because the layout already has a map and tower built in, tap \"Switch layout\" until they're gone, then tap \"Map\".",
          "Tap a car on the map to open its onboard. Watch the card: at first there's no speed, then it appears once the car data has downloaded that far.",
          "Drag the timeline far ahead (say 40 minutes) and let go: the speed disappears, then comes back once the data reaches the new moment.",
          "Drag back to where you were: the speed shows straight away (it isn't downloaded again).",
          "Mobile data (phone only, the simulator can't do it): on the phone, Settings › Track map › turn \"Speed readouts on mobile data\" off, turn Wi‑Fi off and use mobile data: no speed appears until Wi‑Fi is back.",
        ],
        pass: "the speed shows only when its data covers the moment on screen, is hidden before the download reaches it and after jumping past it, and pauses on mobile data with the switch off." },
      { id: "b12-tower", t: "Tower looks right", h: "Columns fit the panel; battle glow and chip in a race; knockout shading in qualifying.",
        steps: [
          "If you haven't picked one yet: Settings (gear on the home screen) › Multiview › \"My driver\" › pick a driver, then \"Done\".",
          "If you turned the simulator for laptop earlier, turn it back so the screen is wider than tall (Device › Rotate Right, ⌘→).",
          "Before opening the video, set the fold to flat: open the simulator fully with its fold control, or in Settings › Debug (bottom of Settings) turn on \"Simulate fold\" and set \"Posture\" to \"Flat\". Settings › Fold › \"Posture\" should read \"Flat\".",
          "From the home screen, tap the \"Archive\" tab, scroll to \"Seasons\", tap \"2026\", then tap the São Paulo weekend (F1 TV names it, something like \"São Paulo Grand Prix\").",
          "In the \"Sessions\" row, tap the race tile.",
          "Tap the red \"Watch multiview\" button.",
          "Wait for the timing: when it has loaded, a thin white tick (lights out, or the session start outside races) appears just under the timeline at the bottom. If the controls are hidden, tap the \"•••\" at the top or the dark space around the feeds.",
          "Tap \"Map\" at the top right (in the single-feed player it's beside ✕ at the top left): the map and the tower appear as floating panels. If there's no \"Map\" button because the layout already has a map and tower built in, tap \"Switch layout\" until they're gone, then tap \"Map\".",
          "Tower header: \"Lap n/71\", the track status, and the air and track temperatures (with a rain mark if it's raining).",
          "Rows: position, a team colour bar, the code, the last lap (purple or green for pace, or PIT), the gap (\"Leader\" for P1), the interval, and the tyre (a coloured ring with its letter and laps). All columns fit the panel's default width.",
          "Battle: find a moment your driver is within a second of another car: both rows glow and a yellow \"Battle\" chip appears in the map's header. Tap it: the rival's onboard opens.",
          "Qualifying: tap ✕, open the qualifying tile, \"Watch multiview\", tap \"Map\": the gap column says \"Fastest\", the knockout zone is shaded and knocked-out cars are dimmed. There's no Battle chip.",
        ],
        pass: "the tower's columns fit, the battle glow and chip show in the race, and qualifying shows the knockout shading and dimmed cars." },
      { id: "b12-ring", t: "Yellow ring on a qualifying flying lap",
        steps: [
          "If you turned the simulator for laptop earlier, turn it back so the screen is wider than tall (Device › Rotate Right, ⌘→).",
          "Before opening the video, set the fold to flat: open the simulator fully with its fold control, or in Settings › Debug (bottom of Settings) turn on \"Simulate fold\" and set \"Posture\" to \"Flat\". Settings › Fold › \"Posture\" should read \"Flat\".",
          "From the home screen, tap the \"Archive\" tab, scroll to \"Seasons\", tap \"2026\", then tap the São Paulo weekend (F1 TV names it, something like \"São Paulo Grand Prix\").",
          "In the \"Sessions\" row, tap the qualifying tile.",
          "Tap the red \"Watch multiview\" button.",
          "Wait for the timing: when it has loaded, a thin white tick (lights out, or the session start outside races) appears just under the timeline at the bottom. If the controls are hidden, tap the \"•••\" at the top or the dark space around the feeds.",
          "Tap \"Map\" at the top right (in the single-feed player it's beside ✕ at the top left): the map and the tower appear as floating panels. If there's no \"Map\" button because the layout already has a map and tower built in, tap \"Switch layout\" until they're gone, then tap \"Map\".",
          "Drag the timeline into a busy part of Q1, Q2 or Q3 (cars out on track, the tower's last-lap times changing).",
          "Watch the map: a car on a flying lap gets a yellow ring around its dot; it goes when the lap ends.",
        ],
        pass: "cars on a flying lap in qualifying have a yellow ring on the map." },
      { id: "b12-growing", t: "A replay watched soon after a session keeps getting speed data", h: "As F1's file grows, until the session is marked final.", tags: ["Live"],
        steps: [
          "This needs a session that has just finished, e.g. a Las Vegas practice or qualifying (Nov 19–22).",
          "Within an hour of the session ending, open its replay from the Race Weekend tab and tap \"Watch multiview\".",
          "Tap \"Map\", tap a car to open its onboard, and drag the timeline near the end of the session.",
          "Watch the card: the speed should still appear late in the session (it may take a minute as F1's file grows).",
          "Come back later (after F1 marks the session final) and check the speed shows all the way to the end.",
        ],
        pass: "on a replay opened soon after the session, the speed keeps coming as F1's car data grows, right to the end." },
      { id: "b12-notices", t: "Onboard notices", h: "\"Couldn't load this session's onboards…\" (single feed, offline) and \"Car N's onboard has stopped…\" (multiview).",
        steps: [
          "If you turned the simulator for laptop earlier, turn it back so the screen is wider than tall (Device › Rotate Right, ⌘→).",
          "Before opening the video, set the fold to flat: open the simulator fully with its fold control, or in Settings › Debug (bottom of Settings) turn on \"Simulate fold\" and set \"Posture\" to \"Flat\". Settings › Fold › \"Posture\" should read \"Flat\".",
          "From the home screen, tap the \"Archive\" tab, scroll to \"Seasons\", tap \"2026\", then tap the São Paulo weekend (F1 TV names it, something like \"São Paulo Grand Prix\").",
          "In the \"Sessions\" row, tap the race tile.",
          "On the race page, tap the first feed row (the world feed, with a ▶ in front) to play it in the single-feed player.",
          "Wait until \"Map\" appears beside ✕ and tap it.",
          "Turn off the Mac's Wi‑Fi (Wi‑Fi icon in the Mac's menu bar › switch Wi‑Fi off; the simulator uses the Mac's connection; unplug the cable if the Mac uses one). Then tap a car on the map (it must be the first car you tap in this player).",
          "The notice \"Couldn't load this session's onboards. Check your connection and try again.\" shows. Turn the Mac's Wi‑Fi back on.",
          "Multiview notice (can't be forced reliably): in a multiview with four feeds, turn Wi‑Fi off until a small onboard tile says \"This feed stopped\", turn Wi‑Fi on, then tap that car on the map: \"Car N's onboard has stopped. Pick it again in the editor.\" If the whole multiview ends with an error instead, note that.",
        ],
        pass: "offline, a car tap in the single-feed player shows \"Couldn't load this session's onboards…\", and tapping a stopped onboard in multiview shows \"Car N's onboard has stopped…\"." },
    ]},
  { id: "b11", title: "Build 11 · Map on replays",
    items: [
      { id: "b11-map", t: "The map moves with the São Paulo replay", h: "Dots stay within about a second of the cars.",
        steps: [
          "If you turned the simulator for laptop earlier, turn it back so the screen is wider than tall (Device › Rotate Right, ⌘→).",
          "Before opening the video, set the fold to flat: open the simulator fully with its fold control, or in Settings › Debug (bottom of Settings) turn on \"Simulate fold\" and set \"Posture\" to \"Flat\". Settings › Fold › \"Posture\" should read \"Flat\".",
          "From the home screen, tap the \"Archive\" tab, scroll to \"Seasons\", tap \"2026\", then tap the São Paulo weekend (F1 TV names it, something like \"São Paulo Grand Prix\").",
          "In the \"Sessions\" row, tap the race tile.",
          "Tap the red \"Watch multiview\" button.",
          "Wait for the timing: when it has loaded, a thin white tick (lights out, or the session start outside races) appears just under the timeline at the bottom. If the controls are hidden, tap the \"•••\" at the top or the dark space around the feeds.",
          "Tap \"Map\" at the top right (in the single-feed player it's beside ✕ at the top left): the map and the tower appear as floating panels. If there's no \"Map\" button because the layout already has a map and tower built in, tap \"Switch layout\" until they're gone, then tap \"Map\".",
          "Watch the world feed (INTERNATIONAL) as the leader comes to the start/finish line.",
          "On the map, the leader's dot should cross the start/finish line within about a second of the car on the video.",
          "Check a few other moments (a car into the pits, a car through a corner).",
          "If the dots run early or late, use \"−1 s\" / \"+1 s\" in the map's header until they match, and write the offset it shows (e.g. \"−8 s\") in the note.",
        ],
        pass: "the dots stay within about a second of the cars in the video." },
      { id: "b11-nudge", t: "−1 s / +1 s moves the dots",
        steps: [
          "If you turned the simulator for laptop earlier, turn it back so the screen is wider than tall (Device › Rotate Right, ⌘→).",
          "Before opening the video, set the fold to flat: open the simulator fully with its fold control, or in Settings › Debug (bottom of Settings) turn on \"Simulate fold\" and set \"Posture\" to \"Flat\". Settings › Fold › \"Posture\" should read \"Flat\".",
          "From the home screen, tap the \"Archive\" tab, scroll to \"Seasons\", tap \"2026\", then tap the São Paulo weekend (F1 TV names it, something like \"São Paulo Grand Prix\").",
          "In the \"Sessions\" row, tap the race tile.",
          "Tap the red \"Watch multiview\" button.",
          "Wait for the timing: when it has loaded, a thin white tick (lights out, or the session start outside races) appears just under the timeline at the bottom. If the controls are hidden, tap the \"•••\" at the top or the dark space around the feeds.",
          "Tap \"Map\" at the top right (in the single-feed player it's beside ✕ at the top left): the map and the tower appear as floating panels. If there's no \"Map\" button because the layout already has a map and tower built in, tap \"Switch layout\" until they're gone, then tap \"Map\".",
          "Pause (⏸ at the bottom left). In the map's header, tap \"−1 s\": the offset reads \"−8 s\" and the dots move back a little.",

  { id: "live", title: "Live weekend only",
    note: "Next chance: Las Vegas, Nov 19–22.",
    items: [
      { id: "live-basics", t: "Live basics from beta 2", h: "LIVE badge, the drop back to 1× at the live edge, \"From the start\" / \"Watch live\", and the multiview layouts on a live race.", tags: ["Live"],
        steps: [
          "During a Las Vegas session (Nov 19–22), open the \"Race Weekend\" tab and tap the session in \"Live now\".",
          "Tap \"Watch multiview\". If the session has been on for over a minute you're asked \"From the start\" or \"Watch live\": choose \"Watch live\".",
          "At the bottom you see a red \"LIVE\" badge, and no speed menu while at the live point.",
          "Pause for 30 s, then play: \"LIVE\" is now outlined and the speed menu is back. Tap \"LIVE\": you jump back to the live point.",
          "Fall behind again, pick \"1.5×\" in the speed menu, and wait: when you catch up, \"Caught up to live, so back to normal speed.\" shows and the speed returns to 1×.",
          "Close, then \"Watch multiview\" again and choose \"From the start\": it starts at the session's start.",
          "Try the multiview layouts in flat, book and laptop with ⟳.",
        ],
        pass: "LIVE, the drop back to 1× at the live point, both start choices and every fold's layouts work on a live session." },
      { id: "live-pitmsg", t: "Late join: \"The pit circle appears when the leader next crosses the line.\"", tags: ["Live"],
        steps: [
          "During the Las Vegas race, join late (after lap 1) from the \"Race Weekend\" tab › \"Live now\" › \"Watch multiview\" › \"Watch live\".",
          "Set the fold to laptop and tap \"Switch layout\" (the ⟳ arrows, top right) until Race Engineer shows.",
          "Look at the console's pit line (under the tyre): it reads \"The pit circle appears when the leader next crosses the line.\"",
          "When the leader next crosses the line, it changes to a \"Pit now → P7 behind ALO\"-style line.",
          "Live timing for the console comes with build 15: if the console shows no timing at all on the live race, write that in the note.",

        pass: "after a late join the console shows \"The pit circle appears when the leader next crosses the line.\" until the leader's next crossing, then the \"Pit now →\" line." },
    ]},

          "Click the crosshair (\"Point to inspect\") and hover over each part: a tile reads its feed's name (plus \"sound on\" for the one you hear); a speaker reads \"Sound from …\" or \"Play sound from …\"; the top bar has \"Close\", \"Switch layout\", \"Show the map\" and \"Feeds\"; the bottom has \"Play\"/\"Pause\", \"Position\", \"Speed 1×\" and \"Audio language, …\"; hidden controls leave \"Show controls\".",
          "Use the inspector's \"Activate\" action on a speaker button: the sound moves.",
        ],
        pass: "every tile and control has a clear name, and the speaker buttons work from the inspector's actions." },
      { id: "b2-exit", t: "Beta 2 exit test", h: "Four São Paulo feeds for 10 minutes without stalling; every fold keeps them in step.",
        steps: [
          "This needs the simulator's own fold control while the video plays (Settings can't be opened over a playing multiview). In Settings › Debug turn \"Simulate fold\" off, and check Settings › Fold › \"Source\" reads \"Device\".",
          "If you turned the simulator for laptop earlier, turn it back so the screen is wider than tall (Device › Rotate Right, ⌘→). Open the simulator fully flat with its own fold control.",
          "From the home screen, tap the \"Archive\" tab, scroll to \"Seasons\", tap \"2026\", then tap the São Paulo weekend (F1 TV names it, something like \"São Paulo Grand Prix\").",
          "In the \"Sessions\" row, tap the race tile.",
          "Tap the red \"Watch multiview\" button.",
          "Tap \"Feeds\" (top right), then \"Reset to default\", then \"Done\", so the four feeds are the world feed (INTERNATIONAL), your driver's onboard, TRACKER and DATA.",
          "Let the four feeds play for 10 minutes (use a timer).",
          "During those minutes, change the fold: book, laptop (rotate first), closed, and back to flat.",
          "Watch for stalls, frozen tiles or \"Paused to keep the main feed smooth\", and check after each fold that the same four feeds show the same moment.",
        ],
        pass: "four São Paulo feeds play for 10 minutes without stalling, and every fold keeps the same feeds in step." },
      { id: "b2-device", t: "Everything above on a real iPhone Duo", tags: ["Phone"],
        steps: [
          "When the iPhone Duo arrives (beta 7): connect it to the Mac, pick it as the run destination in Xcode, and press Run.",
          "Sign in, then go through the Beta 2 backlog and the build 11–14 checks on the phone, using the real fold.",
          "Note anything that behaves differently from the simulator.",
        ],
        pass: "everything above works on the real iPhone Duo as it did in the simulator." },
    ]},
];

const LABELS = { todo: "Not tried", ok: "Works", bad: "Problem" };
let state = {};          // id -> {s, n}
let filter = "all";
let db = null, local = false;
const openNotes = new Set();
const openSteps = new Set();
document.addEventListener("toggle", e => {
  const id = e.target.dataset?.steps; if (!id) return;
  if (e.target.open) openSteps.add(id); else openSteps.delete(id);
}, true);

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function st(id) { return state[id] || { s: "todo", n: "" }; }

function render() {
  const all = GROUPS.flatMap(g => g.items);
  const ok = all.filter(i => st(i.id).s === "ok").length, bad = all.filter(i => st(i.id).s === "bad").length;
  document.getElementById("cOk").textContent = ok;
  document.getElementById("cBad").textContent = bad;
  document.getElementById("cTodo").textContent = all.length - ok - bad;
  document.getElementById("mOk").style.width = (all.length ? ok / all.length * 100 : 0) + "%";
  document.getElementById("mBad").style.width = (all.length ? bad / all.length * 100 : 0) + "%";

  const openGroups = new Set([...document.querySelectorAll("details[open]")].map(d => d.dataset.g));
  const first = !document.querySelector("details");
  const focusId = document.activeElement?.id;
  const main = document.getElementById("groups");
  main.innerHTML = GROUPS.map(g => {
    const items = g.items.filter(i => filter === "all" || st(i.id).s === filter);
    const done = g.items.filter(i => st(i.id).s !== "todo").length;
    const isOpen = first ? (g.open || g.items.length === 0) : openGroups.has(g.id) || filter !== "all";
    const rows = items.map(i => {
      const v = st(i.id), showNote = v.s === "bad" || v.n || openNotes.has(i.id);
      const tags = [...(i.code ? [`<span class="tag code">${esc(i.code)}</span>`] : []), ...(i.tags || []).map(t => `<span class="tag">${esc(t)}</span>`)].join("");
      return `<div class="item" data-s="${v.s}">
        <div class="it-text"><div class="it-title">${esc(i.t)}</div>${i.h ? `<div class="it-how">${esc(i.h)}</div>` : ""}
          ${i.cmd ? `<pre class="cmd">${esc(i.cmd)}</pre><button class="copy" type="button" data-copy="${esc(i.id)}">Copy commands</button>` : ""}
          ${tags ? `<div class="tags">${tags}</div>` : ""}
          ${i.steps ? `<details class="steps" data-steps="${i.id}" ${openSteps.has(i.id) ? "open" : ""}><summary>How to test</summary><ol>${i.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>${i.pass ? `<p class="pass"><b>Works if:</b> ${esc(i.pass)}</p>` : ""}</details>` : ""}</div>
        <div class="seg" role="group" aria-label="Result for ${esc(i.t)}">${["todo", "ok", "bad"].map(s => `<button type="button" data-id="${i.id}" data-v="${s}" aria-pressed="${v.s === s}">${LABELS[s]}</button>`).join("")}</div>
        ${showNote ? `<div class="note"><label for="n-${i.id}">${v.s === "bad" ? "What went wrong?" : "Note"}</label><textarea id="n-${i.id}" data-note="${i.id}" placeholder="${v.s === "bad" ? "What you did, what you saw" : "Optional"}">${esc(v.n || "")}</textarea></div>` : `<button class="addnote" type="button" data-addnote="${i.id}">Add a note</button>`}
      </div>`;
    }).join("");
    const empty = g.items.length === 0 ? "" : (items.length === 0 ? `<div class="empty">Nothing here for this filter.</div>` : "");
    return `<section class="group"><details data-g="${g.id}" ${isOpen ? "open" : ""}><summary><h2>${esc(g.title)}</h2><span class="count">${g.items.length ? `${done}/${g.items.length}` : "soon"}</span></summary>
      ${g.note ? `<p class="gnote">${esc(g.note)}</p>` : ""}${rows}${empty}</details></section>`;
  }).join("");
  if (focusId) document.getElementById(focusId)?.focus();
}

async function save(id, patch) {
  const next = { ...st(id), ...patch, at: new Date().toISOString() };
  state[id] = next; render();
  if (db) {
    try { await db.collection("checks").doc(id).set({ s: next.s, n: next.n || "", at: next.at }); setSaved("Saved to your Claude account"); }
    catch (e) { setSaved("Couldn't save just now. Your last change may not be kept."); }
  } else {
    try { localStorage.setItem("beta3-checks", JSON.stringify(state)); } catch {}
  }
}
function setSaved(t) { document.getElementById("saved").textContent = t; }

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.f) { filter = b.dataset.f; document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b)); render(); return; }
  if (b.dataset.v && b.dataset.id) { if (st(b.dataset.id).s !== b.dataset.v) save(b.dataset.id, { s: b.dataset.v }); return; }
  if (b.dataset.addnote) { openNotes.add(b.dataset.addnote); render(); document.getElementById("n-" + b.dataset.addnote)?.focus(); return; }
  if (b.dataset.copy) { const i = GROUPS.flatMap(g => g.items).find(x => x.id === b.dataset.copy); copyText(i.cmd, b); return; }
  if (b.id === "copyProblems") {
    const lines = GROUPS.flatMap(g => g.items.filter(i => st(i.id).s === "bad").map(i => `- [${g.title}] ${i.t}${st(i.id).n ? ": " + st(i.id).n : ""}`));
    copyText(lines.length ? "Problems found in the beta 3 test run:\n" + lines.join("\n") : "No problems marked yet.", b, document.getElementById("copyMsg"));
  }
});
const timers = {};
document.addEventListener("input", e => {
  const id = e.target.dataset?.note; if (!id) return;
  const val = e.target.value; state[id] = { ...st(id), n: val };
  clearTimeout(timers[id]); timers[id] = setTimeout(() => save(id, { n: val }), 900);
});
document.addEventListener("focusout", e => {
  const id = e.target.dataset?.note; if (!id) return;
  if (timers[id]) { clearTimeout(timers[id]); delete timers[id]; save(id, { n: e.target.value }); }
});
async function copyText(text, btn, msgEl) {
  const old = btn.textContent;
  try { await navigator.clipboard.writeText(text); btn.textContent = "Copied"; if (msgEl) msgEl.textContent = ""; }
  catch { if (msgEl) { msgEl.textContent = text; } else { btn.textContent = "Select the text above to copy"; } }
  setTimeout(() => { btn.textContent = old; }, 1600);
}

render();
(async () => {
  db = await (window.claude?.use ? window.claude.use("db") : null);
  if (!db) {
    local = true;
    try { state = JSON.parse(localStorage.getItem("beta3-checks") || "{}") || {}; } catch { state = {}; }
    setSaved("Saved on this device only"); render(); return;
  }
  const timer = setTimeout(() => setSaved("Can't reach your saved results yet."), 10000);
  db.collection("checks").onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(d => { const v = d.data(); next[d.id] = { s: v.s || "todo", n: v.n || "" }; });
    const editing = document.activeElement?.dataset?.note;
    if (editing && state[editing]) next[editing] = { ...next[editing], n: state[editing].n };
    state = next;
    if (!snap.metadata.fromCache) { clearTimeout(timer); setSaved("Saved to your Claude account"); }
    render();
  }, () => { clearTimeout(timer); setSaved("Saving is unavailable right now."); });
})();
</script>
